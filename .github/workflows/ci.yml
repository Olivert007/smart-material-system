name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q
      - name: OpenAPI drift check (backend ↔ deploy/openapi.json)
        env:
          PYTHONPATH: .
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- deploy/openapi.json || {
            echo '::error::deploy/openapi.json drifted from app OpenAPI; run `PYTHONPATH=. python3 scripts/export_openapi.py` and commit'
            exit 1
          }
      - name: Phase A smoke
        env:
          PYTHONPATH: .
          OPS_TOKEN: ci-ops-token
        run: python tests/smoke_phase_a.py

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: OpenAPI types drift check (deploy/openapi.json ↔ generated.ts)
        working-directory: frontend
        run: npm run api:check
      - name: Build
        working-directory: frontend
        run: npm run build
