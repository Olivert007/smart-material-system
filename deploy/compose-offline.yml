# Offline compose stack (doc 21 O3-O4).
# Usage:
#   cp deploy/offline.env.example deploy/offline.env
#   docker compose -f deploy/compose-offline.yml --env-file deploy/offline.env up -d
#
# Requires model weights mounted at ${MODELS_DIR:-/models} on the host.
# GPU: uncomment `gpus: all` on vllm-* services if your compose version supports it.

x-api-env: &api-env
  DATA_DIR: /app/data
  SEED_DIR: /app/seed
  OPS_TOKEN: ${OPS_TOKEN:?OPS_TOKEN must be set}
  PYTHONPATH: /app
  DISABLE_INTAKE_WORKER: "1"
  LLM_BIG_ENDPOINT: http://vllm-big:8001/v1
  LLM_FAST_ENDPOINT: http://vllm-fast:8000/v1
  LLM_EMBED_ENDPOINT: http://vllm-embed:8002/v1
  LLM_BIG_MODEL: ${LLM_BIG_MODEL:-qwen3.6-27b}
  LLM_FAST_MODEL: ${LLM_FAST_MODEL:-qwen2.5-7b}
  LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-qwen3-embedding-0.6b}
  EMBED_FALLBACK_LEXICAL: "1"
  FRONTEND_DIST: /app/frontend_dist_unused

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - sms-data:/app/data
    expose:
      - "8010"
    entrypoint: ["/bin/bash", "/app/scripts/docker_entrypoint_api.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - sms-data:/app/data
    entrypoint: ["/bin/bash", "/app/scripts/docker_entrypoint_api.sh"]
    command: ["python3", "/app/scripts/run_intake_worker.py"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

  vllm-big:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    volumes:
      - ${MODELS_DIR:-/models}:/models:ro
    command:
      - --model
      - /models/Qwen3.6-27B-FP8
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --served-model-name
      - ${LLM_BIG_MODEL:-qwen3.6-27b}
      - --gpu-memory-utilization
      - "0.45"
    expose:
      - "8001"
    # gpus: all

  vllm-fast:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    volumes:
      - ${MODELS_DIR:-/models}:/models:ro
    command:
      - --model
      - /models/Qwen2.5-7B-Instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - ${LLM_FAST_MODEL:-qwen2.5-7b}
      - --gpu-memory-utilization
      - "0.25"
    expose:
      - "8000"
    # gpus: all

  vllm-embed:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    volumes:
      - ${MODELS_DIR:-/models}:/models:ro
    command:
      - --model
      - /models/Qwen3-Embedding-0.6B
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --runner
      - pooling
      - --convert
      - embed
      - --served-model-name
      - ${LLM_EMBED_MODEL:-qwen3-embedding-0.6b}
    expose:
      - "8002"
    # gpus: all

volumes:
  sms-data:
