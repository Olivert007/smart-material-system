# F1 local/dev compose skeleton (docs/11 §4.3)
# Usage (when docker compose is available in this environment):
#   docker compose -f deploy/compose.dev.yml up api frontend
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
      - ../data:/app/data
    environment:
      - DATA_DIR=/app/data
      - OPS_TOKEN=${OPS_TOKEN:-dev-ops-token-change-me}
      - PYTHONPATH=/app
      - ALLOW_FREE_QUERY=0
    command: >
      bash -lc "pip install -r requirements.txt -q &&
      uvicorn app.main:app --host 0.0.0.0 --port 8010"
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    image: node:20-bookworm
    working_dir: /frontend
    volumes:
      - ../frontend:/frontend
    environment:
      - VITE_API_PROXY_TARGET=http://api:8010
    command: >
      bash -lc "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
